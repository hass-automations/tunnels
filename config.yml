name: "Tunnels: Home Assistant remote access"
version: "0.1.0"
slug: "tunnels"
description: >-
  An add-on for connecting to various VPNs for remote access to Home Assistant
url: "https://github.com/hass-automations/tunnels"
init: false

arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386

startup: services
boot: auto

host_network: true
kernel_modules: true
privileged:
  - NET_ADMIN

ingress: true
ingress_port: 8099
panel_icon: "mdi:vpn"
panel_title: "Tunnels"
panel_admin: true

map:
  - type: addon_config
    read_only: false
    path: /config

options:
  interface: wg0
  config_file: wg0.conf
  autostart: false
  autostart_delay_seconds: 5
  ingress_allow_ip: "172.30.32.2"
  log_level: info

schema:
  interface: str
  config_file: str
  autostart: bool
  autostart_delay_seconds: list(3|5|10|15|30|60|120|300)
  ingress_allow_ip: str
  log_level: list(debug|info|warning|error)
